name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Lint API
        run: npm run lint -w packages/api -- --max-warnings 50

      - name: Typecheck API
        run: npm run typecheck -w packages/api

  # Até este job existir, os testes do `packages/api` NUNCA rodavam no CI: só
  # lint, typecheck e build. A suíte inteira (e a catraca de cobertura em
  # `vitest.config.ts`) dependia de alguém lembrar de rodar `npm test` na
  # máquina local antes de abrir o PR — ou seja, não protegia nada.
  #
  # `test:coverage` roda `vitest run --coverage`, e os `thresholds` da config
  # fazem o comando sair diferente de zero quando a cobertura CAI. É isso que
  # transforma os limiares de número decorativo em catraca de verdade.
  # A regra continua: subir os limiares quando a cobertura sobe, nunca baixar
  # para o build passar.
  test:
    name: API — Testes & cobertura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `coverage.all: true` faz o v8 instrumentar todo `src/**/*.ts`, inclusive
      # os que nenhum teste importa. Alguns deles importam `@prisma/client`, que
      # não existe antes do generate.
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Testes + cobertura
        run: npm run test:coverage -w packages/api

      # Teste verde NÃO prova que o código sobe. O vitest roda sobre o Vite,
      # que faz seu próprio interop de CommonJS e aceita
      # `import { x } from 'pacote-cjs'`; o Node em ESM nativo não aceita, e o
      # processo morre no boot com "Named export não encontrado". Foi assim que
      # o `cron-parser` derrubou dois deploys com o CI inteiro verde.
      #
      # Este passo importa cada módulo compilado com o Node de verdade — sem
      # subir servidor nem tocar em banco.
      - name: Módulos importam no Node ESM
        run: npm run verify:imports -w packages/api

  # Até este job existir, só o `packages/api` tinha teste. O `sdk` é o pacote
  # que OUTROS projetos instalam — erro ali aparece na casa dos outros —, o
  # `cli` grava o token do usuário em disco, e o `api-client` do web é por onde
  # todo o dashboard fala com a API. Os três estavam sem um teste sequer.
  #
  # Escopo deliberado: só lógica pura, ambiente `node`. Componente React fica
  # de fora (exigiria jsdom + testing-library), e por isso a cobertura do `web`
  # mede apenas os `.ts` — misturar "não testado" com "fora de escopo" no mesmo
  # número tornaria o número inútil.
  pacotes:
    name: SDK, CLI e Web — Testes

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pacote: [sdk, cli, web]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Testes + cobertura (${{ matrix.pacote }})
        run: npm run test:coverage -w packages/${{ matrix.pacote }}

  web:
    name: Web — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Next.js
        run: npm run build:web

  sdk:
    name: SDK — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build SDK
        run: npm run build -w packages/sdk
