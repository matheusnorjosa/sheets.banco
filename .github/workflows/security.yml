name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday at 09:13 UTC — catches newly disclosed CVEs without
    # syncing to a busy crontab minute.
    - cron: '13 9 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit (high+ fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # O que BLOQUEIA é o workspace da API: é o único que roda como servidor
      # exposto na internet, e é exatamente o que o Dockerfile instala
      # (`npm ci --workspace=packages/api --workspace=packages/shared`).
      # --audit-level=high falha em high+critical; moderate aparece no resumo.
      - name: Audit da API (bloqueia)
        run: |
          npm audit --omit=dev --workspace=packages/api --audit-level=high || EXIT=$?
          echo "api_exit=${EXIT:-0}" >> $GITHUB_STEP_SUMMARY
          exit ${EXIT:-0}

      # O monorepo inteiro é auditado e reportado, mas NÃO bloqueia. Motivo:
      # packages/web (Next na Vercel) arrasta advisories cujo único "fix"
      # oferecido pelo npm é DESCER de major (next 16 -> 14.2.35). Falhar o
      # build por algo sem correção real transforma o gate em ruído
      # permanente e treina todo mundo a ignorá-lo.
      # Revisar quando sair Next com correção; se aparecer algo acionável
      # aqui, tratar na hora.
      - name: Audit do monorepo (informativo)
        run: |
          echo '### Audit do monorepo (não bloqueia)' >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true

  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so trufflehog can diff against the base branch on PRs
          # and scan all commits on push.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || github.event.repository.default_branch }}
          head: ${{ github.event.after || 'HEAD' }}
          # --only-verified: only fail on secrets that trufflehog could actually
          # authenticate against the upstream service. Cuts most false positives.
          extra_args: --only-verified
